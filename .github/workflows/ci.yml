name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Тесты (эталонные библиотеки + эмулятор с живым WalletTg)
        run: npm test
      - name: Сборка
        run: npm run build
      - name: Контрольная сумма сборки
        run: sha256sum dist/index.html
